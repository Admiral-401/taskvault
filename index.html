    <main>
        <div class="container" >

            <div class="heading">
                <i class="fa-solid fa-list-ul"></i>
                <h2>To-Do</h2>
            </div>

                <input type="text" class="typing-area" placeholder="Enter task...">
                <button class="add">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <select class="tasks" name="sort">

                    <option value="done">Complete</option>
